services:
  music-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-music-bot
    restart: unless-stopped
    depends_on:
      - bgutil-provider
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TEMP_DIR: /app/temp
    volumes:
      # Bind-mounted (not a named volume) so it's easy to inspect on the
      # Proxmox host and survives `docker compose down`, but files are still
      # short-lived: the download -> play -> delete cycle keeps this folder
      # near-empty at steady state (current track + one pre-fetched track).
      - ./temp:/app/temp
    # Tighten this further (e.g. drop more capabilities) once you've
    # confirmed the bot runs cleanly in your environment.
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Mints YouTube PO (proof-of-origin) tokens on demand. YouTube requires
  # these for audio-only downloads from datacenter/server IPs, separately
  # from the JS-signature challenge yt-dlp already solves via
  # --js-runtimes. music-bot reaches this by its service name, "bgutil-
  # provider", over the default compose network — see YT_DLP_EXTRA_ARGS
  # in .env.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
